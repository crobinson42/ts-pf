version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all minor + patch bumps; majors stay separate.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Internal workspace dependencies are versioned by Changesets.
      - dependency-name: '@ts-pf/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
