name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Node floor is >=22; 22 is the primary version (.nvmrc).
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:root
      - run: npm run check:skills
      - run: npm run check:deps
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - run: npm run check:exports
      - run: npm run check:snippets

  # PRs that change a published packages/* package must include a .changeset/*.md
  # (.agents/rules.md). `changeset status` exits non-zero when a package changed
  # since the base branch without a changeset covering it. The Version packages PR
  # (changesets/action, branch changeset-release/main) consumes changesets by
  # design, so it is skipped; so are Dependabot PRs (dependency bumps carry no changeset).
  changesets:
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      - run: npx changeset status --since="origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
