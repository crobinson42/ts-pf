name: release

# This workflow does not `needs:` the ci workflow (both fire on push to main,
# and workflow_dispatch has no ci run to wait on), so it is self-verifying: it
# runs the repo's "done" chain (lint, lint:root, check:skills, check:deps,
# type-check, test, build, check:exports, check:snippets) before
# changesets/action may version or publish anything.
#
# Node: ci tests 22/24 and .nvmrc pins 22 for local work. Release stays on
# Node 24 with a global npm@11.12.1 because that is the runtime the npm OIDC
# trusted-publishing flow below was verified with; it is not switched to
# node-version-file so a Node bump cannot alter the publish path.
#
# Requires Settings → Actions → General → Workflow permissions:
#   - Read and write permissions
#   - Allow GitHub Actions to create and approve pull requests
# https://github.com/crobinson42/ts-pf/settings/actions
#
# npm trusted publisher on each @ts-pf/* package (filename only, case-sensitive):
#   user crobinson42, repo ts-pf, workflow release.yml, environment empty,
#   allow npm publish (not stage-only — that is the default after 3 Sep 2026).
# Do not set registry-url on setup-node: it writes an empty _authToken and
# npm then skips OIDC (ENEEDAUTH).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_docs:
        description: Deploy docs even if no package was published
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install -g npm@11.12.1
      - run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          echo "npm $(npm --version)"
          echo "OIDC request URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:root
      - run: npm run check:skills
      - run: npm run check:deps
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - run: npm run check:exports
      - run: npm run check:snippets
      - run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          node scripts/probe-npm-oidc.mjs
      - uses: changesets/action@v2
        id: changesets
        with:
          pr-title: Version packages
          commit-message: 'chore: version packages'
          version-script: npm run changeset:version
          publish-script: npm run changeset:publish
        env:
          # @changesets/changelog-github (.changeset/config.json) reads
          # GITHUB_TOKEN during `changeset version` to link PRs and authors.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_LOGLEVEL: verbose

  build-docs:
    name: Build docs
    needs: release
    # always() lets this job run when publish fails. A failed needs job
    # would otherwise skip the docs site. Main pushes deploy the site even
    # when every package version is already on npm.
    if: |
      always() &&
      needs.release.result != 'cancelled' &&
      (
        needs.release.outputs.published == 'true' ||
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_docs)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=@ts-pf/site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy-docs:
    name: Deploy docs
    needs: build-docs
    # The github-pages environment skips this job when any other job in the
    # run fails or is cancelled, unless an if is set. Deploy whenever the
    # docs build succeeded and the run itself was not cancelled.
    if: ${{ !cancelled() && needs.build-docs.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
