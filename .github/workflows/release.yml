name: release

# This workflow does not `needs:` the ci workflow (both fire on push to main,
# and workflow_dispatch has no ci run to wait on), so it is self-verifying: it
# runs the repo's "done" chain (lint, check:skills, type-check, test, build,
# check:exports) before changesets/action may version or publish anything.
#
# Node: ci tests 22/24 and .nvmrc pins 22 for local work. Release stays on
# Node 24 with a global npm@11.12.1 because that is the runtime the npm OIDC
# trusted-publishing flow below was verified with; it is not switched to
# node-version-file so a Node bump cannot alter the publish path.
#
# Requires Settings → Actions → General → Workflow permissions:
#   - Read and write permissions
#   - Allow GitHub Actions to create and approve pull requests
# https://github.com/crobinson42/ts-pf/settings/actions
#
# npm trusted publisher on each @ts-pf/* package (filename only, case-sensitive):
#   user crobinson42, repo ts-pf, workflow release.yml, environment empty,
#   allow npm publish (not stage-only — that is the default after 3 Sep 2026).
# Do not set registry-url on setup-node: it writes an empty _authToken and
# npm then skips OIDC (ENEEDAUTH).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install -g npm@11.12.1
      - run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          echo "npm $(npm --version)"
          echo "OIDC request URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:root
      - run: npm run check:skills
      - run: npm run check:deps
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - run: npm run check:exports
      - run: npm run check:snippets
      - run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          node scripts/probe-npm-oidc.mjs
      - uses: changesets/action@v2
        with:
          title: Version packages
          commit: 'chore: version packages'
          version: npm run changeset:version
          publish: npm run changeset:publish
        env:
          # @changesets/changelog-github (.changeset/config.json) reads
          # GITHUB_TOKEN during `changeset version` to link PRs and authors.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_LOGLEVEL: verbose
