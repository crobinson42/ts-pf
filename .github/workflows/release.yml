name: release

# Requires Settings → Actions → General → Workflow permissions:
#   - Read and write permissions
#   - Allow GitHub Actions to create and approve pull requests
# https://github.com/crobinson42/ts-pf/settings/actions

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@11.12.1
      # setup-node writes `_authToken=${NODE_AUTH_TOKEN}`. An empty token makes
      # npm skip OIDC and fail with ENEEDAUTH. Trusted publishing needs no token.
      - run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi
      - run: npm ci
      - run: npm run build
      - uses: changesets/action@v1
        with:
          title: Version packages (beta)
          commit: 'chore: version packages'
          version: npm run changeset:version
          publish: npm run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ''
