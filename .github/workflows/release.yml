name: release

# Requires Settings → Actions → General → Workflow permissions:
#   - Read and write permissions
#   - Allow GitHub Actions to create and approve pull requests
# https://github.com/crobinson42/ts-pf/settings/actions
#
# npm trusted publisher on each @ts-pf/* package (filename only, case-sensitive):
#   user crobinson42, repo ts-pf, workflow release.yml, environment empty,
#   allow npm publish (not stage-only — that is the default after 3 Sep 2026).
# Do not set registry-url on setup-node: it writes an empty _authToken and
# npm then skips OIDC (ENEEDAUTH).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install -g npm@11.12.1
      - run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          echo "npm $(npm --version)"
          echo "OIDC request URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
      - run: npm ci
      - run: npm run build
      - uses: changesets/action@v1
        with:
          title: Version packages (beta)
          commit: 'chore: version packages'
          version: npm run changeset:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          node scripts/probe-npm-oidc.mjs
      - run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          npm run changeset:publish
        env:
          NPM_CONFIG_LOGLEVEL: verbose
