<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ts-pf workshop</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body {
        max-width: 42rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      section {
        margin-bottom: 1.5rem;
      }
      pre {
        background: Canvas;
        border: 1px solid GrayText;
        padding: 0.75rem;
        min-height: 2rem;
        white-space: pre-wrap;
      }
      label {
        display: block;
        margin: 0.4rem 0;
      }
    </style>
  </head>
  <body>
    <h1>planet workshop</h1>
    <p>
      Contract-first demo. The web package imports
      <code>@ts-pf/client</code> and the shared contract — never
      <code>@ts-pf/server</code>.
    </p>

    <section>
      <label>Bearer token <input id="token" /></label>
    </section>

    <section>
      <button id="list-btn" type="button">list</button>
      <pre id="list"></pre>
    </section>

    <section>
      <label>find id <input id="find-id" type="number" value="1" /></label>
      <button id="find-btn" type="button">find</button>
      <pre id="find-out"></pre>
    </section>

    <section>
      <label>create name <input id="create-name" value="Venus" /></label>
      <button id="create-btn" type="button">create</button>
      <pre id="create-out"></pre>
    </section>

    <section>
      <label>
        describe id <input id="describe-id" type="number" value="1" />
      </label>
      <button id="describe-btn" type="button">describe</button>
      <pre id="describe-out"></pre>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
